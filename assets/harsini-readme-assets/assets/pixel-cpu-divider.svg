
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="1000" height="100" role="img">
  <defs>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A88AE0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A88AE0" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shooting star 1 -->
  <g>
    <path d="M70 27 L180 27" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
    <path d="M180 20 L187 27 L180 34 L173 27 Z" fill="#F4A6D7"/>
    <animateTransform attributeName="transform" type="translate"
      values="-150 0; 850 0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting star 2 -->
  <g>
    <path d="M250 70 L335 70" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
    <path d="M335 62 L343 70 L335 78 L327 70 Z" fill="#F4A340"/>
    <animateTransform attributeName="transform" type="translate"
      values="-250 0; 900 0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting star 3 -->
  <g>
    <path d="M680 19 L765 19" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
    <path d="M765 10 L774 19 L765 28 L756 19 Z" fill="#A88AE0"/>
    <animateTransform attributeName="transform" type="translate"
      values="-200 0; 950 0" dur="5.8s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- Central pixel CPU -->
  <g transform="translate(500 50)" filter="url(#glow)">
    <!-- CPU pins -->
    <g fill="#F4A340">
      <rect x="-5" y="-39" width="10" height="10"/>
      <rect x="-5" y="29" width="10" height="10"/>
      <rect x="-39" y="-5" width="10" height="10"/>
      <rect x="29" y="-5" width="10" height="10"/>

      <rect x="-24" y="-39" width="7" height="10"/>
      <rect x="17" y="-39" width="7" height="10"/>
      <rect x="-24" y="29" width="7" height="10"/>
      <rect x="17" y="29" width="7" height="10"/>

      <rect x="-39" y="-24" width="10" height="7"/>
      <rect x="-39" y="17" width="10" height="7"/>
      <rect x="29" y="-24" width="10" height="7"/>
      <rect x="29" y="17" width="10" height="7"/>
    </g>

    <!-- Chip body -->
    <rect x="-29" y="-29" width="58" height="58"
      fill="#25213A" stroke="#A88AE0" stroke-width="3"/>

    <!-- Inner pixel frame -->
    <rect x="-21" y="-21" width="42" height="42"
      fill="#393052" stroke="#F4A340" stroke-width="2"/>

    <!-- Pixel circuit detail -->
    <g fill="#F4A6D7">
      <rect x="-13" y="-13" width="8" height="8"/>
      <rect x="5" y="-13" width="8" height="8"/>
      <rect x="-13" y="5" width="8" height="8"/>
      <rect x="5" y="5" width="8" height="8"/>
    </g>
    <rect x="-5" y="-5" width="10" height="10" fill="#F4A340"/>
    <rect x="-2" y="-2" width="4" height="4" fill="#FFF0D5"/>
  </g>

  <!-- Tiny accent sparkles -->
  <g fill="#F4A340">
    <path d="M390 36 L394 45 L403 49 L394 53 L390 62 L386 53 L377 49 L386 45 Z"/>
    <path d="M610 37 L613 44 L620 47 L613 50 L610 57 L607 50 L600 47 L607 44 Z"/>
  </g>
  <g fill="#A88AE0">
    <path d="M430 76 L433 82 L439 85 L433 88 L430 94 L427 88 L421 85 L427 82 Z"/>
    <path d="M570 8 L573 14 L579 17 L573 20 L570 26 L567 20 L561 17 L567 14 Z"/>
  </g>
</svg>
